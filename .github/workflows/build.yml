name: Build DIVINITY

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: "macOS Universal (Apple Silicon + Intel) - VST3 / AU / Standalone"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build plugin + tests
        run: cmake --build build --config Release --target DIVINITY_VST3 DIVINITY_AU DIVINITY_Standalone DivinityTests -- -quiet

      - name: Run DIVINITY tests
        run: ./build/DivinityTests_artefacts/Release/DivinityTests test-output

      - name: Validate AU with auval
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/DIVINITY_artefacts/Release/AU/DIVINITY.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumu Dvnt T7au

      - name: Validate VST3 with pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process "build/DIVINITY_artefacts/Release/VST3/DIVINITY.vst3"

      - name: Package
        run: |
          mkdir -p dist
          cp -R build/DIVINITY_artefacts/Release/VST3/DIVINITY.vst3 dist/
          cp -R build/DIVINITY_artefacts/Release/AU/DIVINITY.component dist/
          cp -R build/DIVINITY_artefacts/Release/Standalone/DIVINITY.app dist/
          cd dist && zip -qr ../DIVINITY-macOS-Universal.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: DIVINITY-macOS-Universal
          path: DIVINITY-macOS-Universal.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output-macOS
          path: test-output

  windows:
    name: "Windows x64 - VST3 / Standalone"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build plugin + tests
        run: cmake --build build --config Release --target DIVINITY_VST3 DIVINITY_Standalone DivinityTests

      - name: Run DIVINITY tests
        run: .\build\DivinityTests_artefacts\Release\DivinityTests.exe test-output

      - name: Crash diagnostics (page heap + cdb)
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pv-diag.zip
          Expand-Archive pv-diag.zip -DestinationPath pvd
          $dbg = "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64"
          # 1) plain run: show the real exit code
          foreach ($seed in @("0x5cfd3aa", "0x571fde1", "0x3593b69")) {
            .\pvd\pluginval.exe --strictness-level 10 --validate-in-process --skip-gui-tests --random-seed $seed "build\DIVINITY_artefacts\Release\VST3\DIVINITY.vst3" > "plain-$seed.txt" 2>&1
            Write-Host ("SEED {0} EXIT CODE: 0x{1:X8} ({1})" -f $seed, $LASTEXITCODE)
            Get-Content "plain-$seed.txt" | Select-Object -Last 4
          }
          if (-not (Test-Path "$dbg\cdb.exe")) { Write-Host "cdb not found"; exit 0 }
          # 2) full page heap + no debug heap, under cdb: break on the faulting write
          & "$dbg\gflags.exe" /p /enable pluginval.exe /full
          $env:_NO_DEBUG_HEAP = "1"
          $sym = "$PWD\build\DIVINITY_artefacts\Release\VST3\DIVINITY.vst3\Contents\x86_64-win;$PWD\build\DIVINITY_artefacts\Release;$PWD\build"
          $cmds = 'sxe -c ".echo === CRASH ===;.ecxr;kpn 40;q" av;sxe -c ".echo === CRASH ===;.ecxr;kpn 40;q" c0000374;sxe -c ".echo === CRASH ===;.ecxr;kpn 40;q" c0000409;sxe -c ".echo === CRASH ===;kpn 40;q" vs;g;.echo === EXITED ===;q'
          & "$dbg\cdb.exe" -g -G -lines -y "$sym" -c $cmds .\pvd\pluginval.exe --strictness-level 10 --validate-in-process --skip-gui-tests --random-seed 0x5cfd3aa "build\DIVINITY_artefacts\Release\VST3\DIVINITY.vst3" 2>&1 | Out-File cdb.txt
          Select-String -Path cdb.txt -Pattern "=== CRASH ===" -Context 0,60 | Select-Object -First 1
          Select-String -Path cdb.txt -Pattern "=== EXITED|SUCCESS|FAILED|Starting tests|exited with code|ExitProcess" | Select-Object -Last 12
          & "$dbg\gflags.exe" /p /disable pluginval.exe

      - name: Validate VST3 with pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pv
          # Gate: every audio / state / automation / threading test at max strictness.
          .\pv\pluginval.exe --strictness-level 10 --skip-gui-tests --validate-in-process "build\DIVINITY_artefacts\Release\VST3\DIVINITY.vst3"
          $code = $LASTEXITCODE
          Write-Host ("GATE EXIT CODE: 0x{0:X8} ({0})" -f $code)
          if ($code -ne 0) { exit 1 }

      - name: pluginval GUI tests (informational - headless runner)
        continue-on-error: true
        shell: pwsh
        run: |
          .\pv\pluginval.exe --strictness-level 10 --verbose "build\DIVINITY_artefacts\Release\VST3\DIVINITY.vst3"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse build\DIVINITY_artefacts\Release\VST3\DIVINITY.vst3 dist\
          Copy-Item build\DIVINITY_artefacts\Release\Standalone\DIVINITY.exe dist\
          Compress-Archive -Path dist\* -DestinationPath DIVINITY-Windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DIVINITY-Windows-x64
          path: DIVINITY-Windows-x64.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output-Windows
          path: test-output
