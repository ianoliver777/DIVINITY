name: Build DIVINITY

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: "macOS Universal (Apple Silicon + Intel) - VST3 / AU / Standalone"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build plugin + tests
        run: cmake --build build --config Release --target DIVINITY_VST3 DIVINITY_AU DIVINITY_Standalone DivinityTests -- -quiet

      - name: Run DIVINITY tests
        run: ./build/DivinityTests_artefacts/Release/DivinityTests test-output

      - name: Validate AU with auval
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/DIVINITY_artefacts/Release/AU/DIVINITY.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumu Dvnt T7au

      - name: Validate VST3 with pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process "build/DIVINITY_artefacts/Release/VST3/DIVINITY.vst3"

      - name: Package
        run: |
          mkdir -p dist
          cp -R build/DIVINITY_artefacts/Release/VST3/DIVINITY.vst3 dist/
          cp -R build/DIVINITY_artefacts/Release/AU/DIVINITY.component dist/
          cp -R build/DIVINITY_artefacts/Release/Standalone/DIVINITY.app dist/
          cd dist && zip -qr ../DIVINITY-macOS-Universal.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: DIVINITY-macOS-Universal
          path: DIVINITY-macOS-Universal.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output-macOS
          path: test-output

  windows:
    name: "Windows x64 - VST3 / Standalone"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build plugin + tests
        run: cmake --build build --config Release --target DIVINITY_VST3 DIVINITY_Standalone DivinityTests

      - name: Run DIVINITY tests
        run: .\build\DivinityTests_artefacts\Release\DivinityTests.exe test-output

      - name: Validate VST3 with pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pv
          # pluginval.exe is a GUI-subsystem app: PowerShell would not wait for it, so use Start-Process -Wait
          $p = Start-Process -FilePath ".\pv\pluginval.exe" -NoNewWindow -Wait -PassThru `
                 -ArgumentList '--strictness-level', '10', '--validate-in-process', '--output-dir', 'pluginval-logs', '"build\DIVINITY_artefacts\Release\VST3\DIVINITY.vst3"'
          Get-ChildItem pluginval-logs -Filter *.txt -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName | Select-Object -Last 15 }
          Write-Host "pluginval exit code: $($p.ExitCode)"
          exit $p.ExitCode

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse build\DIVINITY_artefacts\Release\VST3\DIVINITY.vst3 dist\
          Copy-Item build\DIVINITY_artefacts\Release\Standalone\DIVINITY.exe dist\
          Compress-Archive -Path dist\* -DestinationPath DIVINITY-Windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DIVINITY-Windows-x64
          path: DIVINITY-Windows-x64.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output-Windows
          path: test-output

  release:
    name: "Bundle mac + windows into one zip and publish a GitHub release"
    needs: [macos, windows]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DIVINITY-macOS-Universal
      - uses: actions/download-artifact@v4
        with:
          name: DIVINITY-Windows-x64
      - name: Bundle zip
        id: bundle
        run: |
          VER=$(grep -oP 'project\(DIVINITY VERSION \K[0-9.]+' CMakeLists.txt)
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          mkdir -p pkg/mac pkg/windows
          (cd pkg/mac && unzip -q ../../DIVINITY-macOS-Universal.zip)
          (cd pkg/windows && { unzip -q ../../DIVINITY-Windows-x64.zip || [ $? -eq 1 ]; })   # exit 1 = warnings (backslash paths from Compress-Archive)
          cp docs/INSTALL.txt pkg/INSTALL.txt
          (cd pkg && zip -qry "../DIVINITY-v$VER.zip" .)
          ls -la "DIVINITY-v$VER.zip"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=${{ steps.bundle.outputs.ver }}
          TAG="v$VER"
          NOTES="DIVINITY $TAG by TRIPLE SEVEN AUDIO. mac/ (VST3 + AU + app, Apple Silicon + Intel) and windows/ (VST3 + exe). Install steps are in INSTALL.txt inside the zip. Details: docs/SOUND_ENGINE_2.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "DIVINITY-v$VER.zip" --clobber
          else
            gh release create "$TAG" "DIVINITY-v$VER.zip" --title "DIVINITY $TAG" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
